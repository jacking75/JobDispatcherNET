name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  release:
    name: build, pack and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # v2.1.0 -> 2.1.0. The tag is the single source of truth for the published version.
      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then
            echo "tag '$GITHUB_REF_NAME' does not carry a version" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION from tag $GITHUB_REF_NAME"

      - name: Restore
        run: dotnet restore All.sln

      - name: Build
        run: dotnet build All.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test JobDispatcherNET.Tests/JobDispatcherNET.Tests.csproj
          -c Release
          --no-build
          --filter "Category!=Stress"
          --logger trx
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: TestResults/
          if-no-files-found: warn

      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          for proj in \
            "JobDispatcherNET/JobDispatcherNET.csproj" \
            "JobDispatcherNET.Extensions.Logging/JobDispatcherNET.Extensions.Logging.csproj" \
            "JobDispatcherNET.Extensions.Hosting/JobDispatcherNET.Extensions.Hosting.csproj"
          do
            if [ -f "$proj" ]; then
              echo "::group::pack $proj"
              dotnet pack "$proj" -c Release -o artifacts -p:Version="$VERSION"
              echo "::endgroup::"
            else
              echo "skipping $proj (not in the tree yet)"
            fi
          done
          ls -l artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ steps.version.outputs.version }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

      - name: Push packages to NuGet
        shell: bash
        run: |
          set -euo pipefail
          dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push symbols to NuGet
        shell: bash
        run: |
          set -euo pipefail
          dotnet nuget push "artifacts/*.snupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](https://github.com/jacking75/JobDispatcherNET/blob/main/CHANGELOG.md) for the full entry for ${{ steps.version.outputs.version }}.
          files: |
            artifacts/*.nupkg
